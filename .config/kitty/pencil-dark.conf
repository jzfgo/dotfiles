# vim:ft=kitty

## name:     Pencil-Dark
## author:   preservim (https://github.com/preservim/vim-colors-pencil)
## license:  MIT
## blurb:    Clean, low-contrast dark palette inspired by iA Writer.

# The basic colors
foreground              #F1F1F1
background              #212121
selection_foreground    #212121
selection_background    #B6D6FD

# Cursor colors
cursor                  #20BBFC
cursor_text_color       #212121

# URL underline color when hovering with mouse
url_color               #20BBFC

# Kitty window border colors
active_border_color     #20BBFC
inactive_border_color   #424242
bell_border_color       #F3E430

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #212121
active_tab_background   #B6D6FD
inactive_tab_foreground #D9D9D9
inactive_tab_background #262626
tab_bar_background      #181818

# Colors for marks (marked text in the terminal)
mark1_foreground #212121
mark1_background #B6D6FD
mark2_foreground #212121
mark2_background #5FD7A7
mark3_foreground #212121
mark3_background #F3E430

