include palenight.conf

font_family MesloLGS NF
font_size   12

allow_remote_control yes
disable_ligatures no
enable_audio_bell no

shell             zsh
shell_integration enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

cursor_shape block
cursor_trail 3
cursor_trail_decay 0.1 0.4

url_style curly

remember_window_size  yes
remember_window_position yes
initial_window_width  80c
initial_window_height 40c
window_padding_width  20
cursor_blink_interval 0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round

background_opacity            0.8
background_blur               64
scrollbar_handle_opacity      0
scrollbar_track_opacity       0
scrollbar_track_hover_opacity 0
confirm_os_window_close       0

sync_to_monitor no

hide_window_decorations titlebar-only
macos_colorspace displayp3

map cmd+t new_tab_with_cwd
map cmd+enter new_window_with_cwd
map cmd+n new_os_window_with_cwd

map ctrl+shift+plus change_font_size current +2.0
map cmd+plus change_font_size current +2.0
map ctrl+shift+minus change_font_size current -2.0
map cmd+minus change_font_size current -2.0
