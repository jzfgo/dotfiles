# vim:ft=kitty

## name:     Pencil-Light
## author:   preservim (https://github.com/preservim/vim-colors-pencil)
## license:  MIT
## blurb:    Clean, low-contrast light palette inspired by iA Writer.

# The basic colors
foreground              #424242
background              #F1F1F1
selection_foreground    #212121
selection_background    #B6D6FD

# Cursor colors
cursor                  #20BBFC
cursor_text_color       #F1F1F1

# URL underline color when hovering with mouse
url_color               #008EC4

# Kitty window border colors
active_border_color     #008EC4
inactive_border_color   #D9D9D9
bell_border_color       #A89C14

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #F1F1F1
active_tab_background   #008EC4
inactive_tab_foreground #424242
inactive_tab_background #D9D9D9
tab_bar_background      #E5E6E6

# Colors for marks (marked text in the terminal)
mark1_foreground #212121
mark1_background #B6D6FD
mark2_foreground #F1F1F1
mark2_background #10A778
mark3_foreground #212121
mark3_background #F3E430

# The 16 terminal colors

# black
color0 #212121
color8 #5F5F5F

# red
color1 #C30771
color9 #E32791

# green
color2  #0B7A57
color10 #10A778

# yellow
color3  #7D730C
color11 #A89C14

# blue
