##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule = match:xwayland true, border_color rgb(ff5555) # check if window is xwayland
windowrule = match:class ^(Rofi)$, opacity 0.85 0.85
windowrule = no_blur off, match:class ^(Rofi)$

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    # Keep the screen awake while anything is fullscreen (games, Steam Big
    # Picture) — hypridle only sees keyboard/mouse, not gamepad input.
    name = fullscreen-inhibits-idle
    match:fullscreen = true

    idle_inhibit = fullscreen
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
