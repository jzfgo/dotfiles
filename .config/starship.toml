"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt, no blank line before each new prompt
# (matches POWERLEVEL9K_PROMPT_ADD_NEWLINE=false)
add_newline = false

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$direnv\
$gcloud\
$cmd_duration\
$jobs\
${env_var.ZMX_SESSION}\
$line_break\
$character"""

right_format = """$time"""

[os]
disabled = false
style = "bold white"

[os.symbols]
Macos = "󰀵 "
Linux = " "

[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"
disabled = false
show_always = false

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"
disabled = false

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold green"
format = "[on](dimmed white) [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style)) "

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold green"

[python]
symbol = " "
format = "[$symbol($version )]($style)"
style = "bold yellow"

[direnv]
disabled = false
symbol = " "
format = "[$symbol$loaded/$allowed]($style) "
style = "bold orange"

[gcloud]
disabled = false
symbol = "󱇶 "
format = "[$symbol($project)]($style) "
style = "bold blue"

[cmd_duration]
min_time = 3_000
format = "took [$duration](bold yellow) "

[jobs]
symbol = "✦"
style = "bold cyan"
number_threshold = 1
format = "[$symbol]($style) "

[env_var.ZMX_SESSION]
symbol = "⧗ "
format = "[$symbol$env_value]($style) "
description = "zmx session name"
style = "bold magenta"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "at [$time]($style)"
style = "dimmed white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
